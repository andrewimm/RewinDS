# XcodeGen spec for the RewinDS iOS app. Regenerate the .xcodeproj with:
#     cd rewinds-ios && xcodegen generate
# The Rust core is built separately into Frameworks/RewindsCore.xcframework by
# ./build-core.sh — run that whenever crates/emulator-ffi changes.
name: RewinDS
options:
  bundleIdPrefix: com.rewinds
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

# Device signing: Signing.xcconfig (committed, no Team ID) optionally includes
# Signing.local.xcconfig (gitignored) where you put `DEVELOPMENT_TEAM = <your id>`, so no
# Team ID lands in source control. The simulator needs no team.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

targets:
  RewinDS:
    type: application
    platform: iOS
    sources:
      - path: RewinDS
      # Copyrighted BIOS/firmware (and optional test ROMs) the developer drops in
      # locally; gitignored, and skipped by XcodeGen when the folder is absent. See
      # dev-assets/README.md. The app also imports these at runtime via Files.
      - path: dev-assets
        type: folder
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rewinds.RewinDS
        INFOPLIST_FILE: RewinDS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Rust staticlib brings its own C++ runtime symbols in via std.
        OTHER_LDFLAGS: [-lc++]
    dependencies:
      # Static-library XCFramework: linked into the app binary, nothing to embed.
      - framework: Frameworks/RewindsCore.xcframework
        embed: false
