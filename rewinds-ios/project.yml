# XcodeGen spec for the RewinDS iOS app. Regenerate the .xcodeproj with:
#     cd rewinds-ios && xcodegen generate
# The Rust core is built separately into Frameworks/RewindsCore.xcframework by
# ./build-core.sh — run that whenever crates/emulator-ffi changes.
name: RewinDS
options:
  bundleIdPrefix: com.setimmediate
  deploymentTarget:
    iOS: "26.0"
    macOS: "14.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

# Device signing: Signing.xcconfig (committed, no Team ID) optionally includes
# Signing.local.xcconfig (gitignored) where you put `DEVELOPMENT_TEAM = <your id>`, so no
# Team ID lands in source control. The simulator needs no team.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

packages:
  RewindsKit:
    path: RewindsKit

targets:
  RewinDS:
    type: application
    platform: iOS
    sources:
      - path: RewinDS
      # Copyrighted BIOS/firmware (and optional test ROMs) the developer drops in
      # locally; gitignored, and skipped by XcodeGen when the folder is absent. See
      # dev-assets/README.md. The app also imports these at runtime via Files.
      - path: dev-assets
        type: folder
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.setimmediate.RewinDS
        INFOPLIST_FILE: RewinDS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Rust staticlib brings its own C++ runtime symbols in via std.
        OTHER_LDFLAGS: [-lc++]
    dependencies:
      # The shared core + link stack, which vends the Rust emulator as a binary XCFramework
      # (RewindsCore) linked transitively — nothing to embed for a static library.
      - package: RewindsKit

  # Native macOS app: keyboard + mouse, no on-screen controls. Shares RewindsKit and the
  # Metal shaders with the iOS app; UI (windows, key handling) is macOS-specific.
  RewinDS-mac:
    type: application
    platform: macOS
    sources:
      - path: rewinds-mac
      - path: RewinDS/Views/Shaders.metal   # shared screen-blit shaders
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.setimmediate.RewinDS
        INFOPLIST_FILE: rewinds-mac/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: [-lc++]
        # A local dev build: sign ad-hoc ("Sign to Run Locally"), no team cert needed, no
        # App Sandbox — so Bonjour/Network needs no entitlement.
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: RewindsKit
